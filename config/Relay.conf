# Override manual jumlah channel relay.
#
# Auto-detect jumlah channel (dari serial number / product string USB
# device) TIDAK bisa diandalkan untuk semua board relay HID clone
# (VID:PID 16c0:05df) -- banyak board tidak menaruh info jumlah channel
# di string itu sama sekali, sehingga aplikasi salah menebak (mis. relay
# 4-channel terbaca cuma 1 channel).
#
# Kalau itu terjadi di board kamu, aktifkan baris di bawah ini sesuai
# jumlah channel fisik relay kamu (1-8). Hapus tanda '#' di depan baris
# untuk mengaktifkan.

NUM_CHANNELS=4