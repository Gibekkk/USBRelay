# USB Relay Auto-Control - Konfigurasi Device
# =============================================
# Format: VID:PID  CHANNEL  ACTION  [LABEL]
#
# VID:PID  : Vendor ID dan Product ID device USB (hex, huruf kecil)
#            Cari dengan: lsusb
#
# CHANNEL  : 1-8   -> channel relay spesifik
#            all   -> semua channel sekaligus
#
# ACTION   : open_on_connect   -> nyalakan relay saat device dipasang
#                                 matikan relay saat device dilepas
#            close_on_connect  -> matikan relay saat device dipasang
#                                 nyalakan relay saat device dilepas
#
# LABEL    : nama bebas (opsional, untuk log)
#
# =============================================
# Cara cari VID:PID device kamu:
#   $ lsusb
#   Bus 001 Device 003: ID 046d:c52b Logitech, Inc. Unifying Receiver
#                           ^^^^ ^^^^
#                           VID  PID
# =============================================

# Contoh: Mouse Logitech -> nyalakan relay ch1
# 046d:c52b  1  open_on_connect  Mouse Logitech Unifying

# Contoh: USB LAN Adapter -> nyalakan relay ch2
# 0bda:8153  2  open_on_connect  USB Ethernet Adapter

# Contoh: Flash drive tertentu -> nyalakan semua relay
# 0781:5567  all  open_on_connect  SanDisk Flash Drive

# Contoh: Charger USB -> matikan relay ch3 (misalnya untuk proteksi)
# 05ac:12a8  3  close_on_connect  iPhone Charger

