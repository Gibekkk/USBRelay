# USB Relay Auto-Control - Konfigurasi Channel Aktif
# ====================================================
# Channel mana saja (1-16) yang AKTIF dipakai aplikasi ini.
#
# Hanya channel yang terdaftar di sini yang:
#   1) Muncul sebagai tombol/indikator di GUI (jumlah tombol otomatis
#      menyesuaikan panjang daftar ini).
#   2) Dipakai oleh sistem ROUND-ROBIN: setiap kali ada NIM baru
#      discan, aplikasi otomatis memakai channel KOSONG bernomor
#      TERKECIL dari daftar ini -- user tidak perlu (dan tidak bisa
#      lagi) memilih channel manual.
#
# Format:
#   - Satu nomor channel per baris (1-16), ATAU
#   - Beberapa nomor dipisah koma di satu baris, mis: 1,2,3,4
#   - Range juga boleh, mis: 1-4 sama artinya dengan 1,2,3,4
#   - Baris diawali '#' = komentar, diabaikan
#   - Urutan/pengelompokan di file ini tidak penting -- yang menentukan
#     urutan round-robin adalah nomor channel itu sendiri (ascending),
#     bukan urutan barisnya di file ini
#
# Kalau file ini tidak ada / kosong / semua baris invalid, aplikasi
# otomatis fallback ke channel 1-4.
# ====================================================

1

# ----------------------------------------------------
# Contoh lain (hapus tanda '#' di depan baris yang mau dipakai,
# dan sesuaikan/hapus baris "1-4" di atas):
# ----------------------------------------------------

# Relay 8 channel, semua dipakai:
# 1-8

# Relay 16 channel, semua dipakai:
# 1-16

# Cuma channel tertentu yang dipakai (tidak harus berurutan):
# 1,3,5,7
